<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Confirmation | Ganesha Grace</title>

    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/config.js"></script>
    <script src="./js/auth-status.js"></script>
    <script src="./js/order-confirmation.js" defer></script>
</head>

<body>

    <header class="site-header">
        <div class="header-top">
            <a class="logo" href="./index.html" aria-label="Ganesha Grace Home">
                Ganesha Grace
            </a>

            <div class="header-search" role="search">
                <form id="header-search-form" action="./shop.html" method="get">
                    <label for="header-search-input" class="visually-hidden">Search products</label>
                    <input
                        type="search"
                        id="header-search-input"
                        name="search"
                        placeholder="Search products..."
                        autocomplete="off"
                    >
                    <button type="submit" class="search-submit" aria-label="Search">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </button>
                </form>
            </div>

            <div class="header-actions">
                <div id="auth-status" class="auth-status">
                    <a href="./login.html" id="account-link">Log In</a>
                    <a href="./register.html" id="register-link">Create Account</a>
                </div>

                <button id="logout-button" class="logout-button" hidden>
                    Log Out
                </button>

                <a id="my-orders-link" class="header-link" href="./my-orders.html" aria-label="My Orders">
                    My Orders
                </a>

                <a id="admin-link" class="header-link" href="./admin.html" aria-label="Admin Dashboard" hidden>
                    Admin
                </a>

                <a class="cart-link" href="./cart.html" aria-label="Shopping cart">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <span id="cart-count" class="cart-count-badge">0</span>
                </a>
            </div>
        </div>
    </header>


    <main class="order-confirmation-container">
        <section class="order-confirmation-card">
            <div class="confirmation-icon" aria-hidden="true">✓</div>

            <h1 id="confirmation-title">Your Order</h1>

            <p id="confirmation-message" role="status" aria-live="polite">
                Retrieving your order details...
            </p>

            <div id="order-details" hidden>
                <div class="order-summary-heading">
                    <h2>Order Summary</h2>
                    <p>
                        Order number:
                        <strong id="order-number"></strong>
                    </p>
                    <p>
                        Order date:
                        <strong id="order-date"></strong>
                    </p>
                </div>

                <div class="order-status-grid">
                    <div>
                        <span>Order status</span>
                        <strong id="order-status"></strong>
                    </div>

                    <div>
                        <span>Payment method</span>
                        <strong id="payment-method"></strong>
                    </div>

                    <div>
                        <span>Payment status</span>
                        <strong id="payment-status"></strong>
                    </div>
                </div>

                <h2 class="order-items-heading">Items Ordered</h2>

                <div id="order-items"></div>

                <div class="order-totals">
                    <div>
                        <span>Subtotal</span>
                        <span id="order-subtotal"></span>
                    </div>

                    <div>
                        <span>Delivery charge</span>
                        <span id="delivery-charge"></span>
                    </div>

                    <div class="order-grand-total">
                        <span>Total</span>
                        <strong id="order-total"></strong>
                    </div>
                </div>
            </div>

            <div class="confirmation-actions">
                <a href="./index.html" class="confirmation-primary-button">
                    Continue Shopping
                </a>

                <a href="./account.html" class="confirmation-secondary-button">
                    View My Account
                </a>
            </div>
        </section>
    </main>

    <script src="./js/order-confirmation.js" defer></script>
</body>
</html>
