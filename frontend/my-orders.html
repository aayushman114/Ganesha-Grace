<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders | Ganesha Grace</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="js/auth-status.js" defer></script>
    <script src="js/my-orders.js" defer></script>
</head>
<body>

    <!-- Header -->
    <header class="site-header">
        <a class="logo" href="./index.html" aria-label="Ganesha Grace Home">
            Ganesha Grace
        </a>

        <nav class="main-nav" aria-label="Main navigation">
            <a href="./index.html#home">Home</a>
            <a href="./index.html#categories">Categories</a>
            <a href="./index.html#featured">Featured Products</a>
            <a href="./my-orders.html">My Orders</a>
        </nav>

        <div class="header-actions">
            <div id="auth-status" class="auth-status">
                <a href="./login.html" id="account-link">Log In</a>
                <a href="./register.html" id="register-link">Create Account</a>
            </div>

            <button id="logout-button" class="logout-button" hidden>
                Log Out
            </button>

            <a class="cart-link" href="./cart.html">
                Cart <span id="cart-count">0</span>
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container my-orders-page">

        <section class="page-heading">
            <h1>My Orders</h1>
            <p>View your order history and track your purchases.</p>
        </section>

        <!-- Loading Message -->
        <div id="orders-loading" class="orders-message" role="status">
            Loading your orders...
        </div>

        <!-- Error Message -->
        <div id="orders-error"
             class="orders-message"
             role="alert"
             hidden>
        </div>

        <!-- Orders List -->
        <section id="orders-list"
                 class="orders-list"
                 aria-label="Your orders">
        </section>

        <!-- Empty State -->
        <div id="orders-empty" class="orders-message" hidden>
            <h2>No orders yet</h2>
            <p>You haven't placed any orders yet.</p>
            <a href="index.html#products" class="btn">
                Start Shopping
            </a>
        </div>

    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 Ganesha Grace. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
