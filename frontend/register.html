<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Ganesha Grace</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main class="auth-container">
        <h1>Create Your Account</h1>

        <p class="auth-description">
            Join Ganesha Grace for a simpler skincare shopping experience.
        </p>

        <form id="register-form" class="auth-form">
            <div class="form-group">
                <label for="name">Full name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    autocomplete="name"
                    minlength="2"
                    maxlength="100"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    maxlength="254"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >
                <small>Use at least 8 characters.</small>
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm password</label>
                <input
                    type="password"
                    id="confirm-password"
                    name="confirm-password"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >
            </div>

            <button type="submit" id="register-button" class="auth-submit">
                Create Account
            </button>

            <p
                id="register-message"
                class="auth-message"
                role="status"
                aria-live="polite"
                hidden
            ></p>
        </form>

        <div class="auth-footer">
            Already have an account?
            <a href="login.html">Log in</a>
        </div>

        <a href="index.html" class="auth-home">Back to Home</a>
    </main>

    <script src="js/register.js"></script>
</body>
</html>
