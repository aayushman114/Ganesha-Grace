<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product | Ganesha Grace</title>

    <meta
        name="description"
        content="Product details - Ganesha Grace"
    >

    <link rel="stylesheet" href="./css/style.css">

    <script src="./js/config.js"></script>
    <script src="./js/auth-status.js"></script>
    <script src="./js/product.js" defer></script>
</head>

<body>
    <header class="site-header">
        <div class="header-top">
            <a class="logo" href="./index.html" aria-label="Ganesha Grace Home">
                Ganesha Grace
            </a>

            <div class="header-search" role="search">
                <form id="header-search-form" action="./shop.html" method="get">
                    <label for="header-search-input" class="visually-hidden">Search products</label>
                    <input
                        type="search"
                        id="header-search-input"
                        name="search"
                        placeholder="Search products..."
                        autocomplete="off"
                    >
                    <button type="submit" class="search-submit" aria-label="Search">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                    </button>
                </form>
            </div>

            <div class="header-actions">
                <div id="auth-status" class="auth-status">
                    <a href="./login.html" id="account-link">Log In</a>
                    <a href="./register.html" id="register-link">Create Account</a>
                </div>

                <button id="logout-button" class="logout-button" hidden>
                    Log Out
                </button>

                <a id="my-orders-link" class="header-link" href="./my-orders.html" aria-label="My Orders">
                    My Orders
                </a>

                <a id="admin-link" class="header-link" href="./admin.html" aria-label="Admin Dashboard" hidden>
                    Admin
                </a>

                <a class="cart-link" href="./cart.html" aria-label="Shopping cart">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <span id="cart-count" class="cart-count-badge">0</span>
                </a>
            </div>
        </div>
    </header>

    <main class="product-main">
        <nav class="breadcrumb" aria-label="Breadcrumb">
            <ol class="breadcrumb-list" id="breadcrumb-list">
                <!-- JavaScript will populate breadcrumb -->
            </ol>
        </nav>

        <div class="product-container">
            <!-- Product Gallery -->
            <div class="product-gallery" id="product-gallery">
                <div class="product-main-image" id="product-main-image">
                    <!-- Main product image -->
                </div>
                <div class="product-thumbnails" id="product-thumbnails" aria-label="Product images">
                    <!-- Thumbnail images -->
                </div>
            </div>

            <!-- Product Info -->
            <div class="product-info" id="product-info">
                <p class="product-category" id="product-category"></p>
                <h1 class="product-title" id="product-title"></h1>

                <div class="product-brand" id="product-brand">
                    <span class="brand-label">Brand:</span>
                    <span class="brand-name"></span>
                </div>

                <div class="product-rating" id="product-rating" aria-label="Rating">
                    <!-- Rating stars -->
                </div>

                <div class="product-price" id="product-price">
                    <!-- Price display -->
                </div>

                <div class="product-description" id="product-description">
                    <h3>Description</h3>
                    <p></p>
                </div>

                <div class="product-stock" id="product-stock">
                    <!-- Stock status -->
                </div>

                <div class="product-actions">
                    <div class="quantity-selector">
                        <label for="quantity" class="visually-hidden">Quantity</label>
                        <button type="button" class="qty-btn" id="qty-decrease" aria-label="Decrease quantity">−</button>
                        <input type="number" id="quantity" name="quantity" value="1" min="1" max="99" aria-label="Quantity">
                        <button type="button" class="qty-btn" id="qty-increase" aria-label="Increase quantity">+</button>
                    </div>

                    <div class="action-buttons">
                        <button type="button" class="btn btn-primary btn-add-to-cart" id="add-to-cart-btn">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="9" cy="21" r="1"></circle>
                                <circle cx="20" cy="21" r="1"></circle>
                                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                            </svg>
                            Add to Cart
                        </button>
                        <button type="button" class="btn btn-buy-now" id="buy-now-btn">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 7H7l-2 8h16l-2-8z"></path>
                                <circle cx="11" cy="16" r="1"></circle>
                                <circle cx="19" cy="16" r="1"></circle>
                            </svg>
                            Buy Now
                        </button>
                    </div>
                </div>

                <div class="product-meta" id="product-meta">
                    <!-- Additional product info like SKU, etc. -->
                </div>
            </div>
        </div>

        <!-- Related Products Section -->
        <section class="related-products" id="related-products" aria-labelledby="related-products-heading">
            <div class="section-heading">
                <h2 id="related-products-heading">You May Also Like</h2>
            </div>
            <div class="product-grid" id="related-products-grid">
                <!-- JavaScript will render related products -->
            </div>
        </section>

        <!-- Reviews Section -->
        <section class="product-reviews" id="product-reviews" aria-labelledby="reviews-heading">
            <div class="section-heading">
                <h2 id="reviews-heading">Customer Reviews</h2>
                <div class="reviews-summary" id="reviews-summary" style="display: none;">
                    <div class="average-rating">
                        <span class="avg-score" id="avg-score">0.0</span>
                        <div class="avg-stars" id="avg-stars"></div>
                        <span class="review-count" id="review-count">0 reviews</span>
                    </div>
                </div>
            </div>

            <!-- Add Review Form -->
            <div class="review-form-section" id="review-form-section" style="display: none;">
                <h3>Write a Review</h3>
                <form id="review-form" class="review-form">
                    <div class="form-group">
                        <label>Your Rating</label>
                        <div class="star-rating-input" id="star-rating-input">
                            <input type="radio" id="star5" name="rating" value="5"><label for="star5" title="5 stars">★</label>
                            <input type="radio" id="star4" name="rating" value="4"><label for="star4" title="4 stars">★</label>
                            <input type="radio" id="star3" name="rating" value="3"><label for="star3" title="3 stars">★</label>
                            <input type="radio" id="star2" name="rating" value="2"><label for="star2" title="2 stars">★</label>
                            <input type="radio" id="star1" name="rating" value="1"><label for="star1" title="1 star">★</label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="review-title">Review Title (optional)</label>
                        <input type="text" id="review-title" name="title" placeholder="Summarize your experience">
                    </div>
                    <div class="form-group">
                        <label for="review-comment">Your Review</label>
                        <textarea id="review-comment" name="comment" rows="4" placeholder="Share your experience with this product..." required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" id="submit-review-btn">Submit Review</button>
                    <p id="review-form-message" class="form-message" hidden></p>
                </form>
            </div>

            <!-- Reviews List -->
            <div class="reviews-list" id="reviews-list">
                <!-- Reviews will be rendered here -->
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; <span id="current-year"></span> Ganesha Grace.</p>
        <p>Skincare and beauty for your everyday routine.</p>
    </footer>
</body>
</html>
